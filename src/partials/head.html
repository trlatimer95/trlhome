<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Content Security Policy -->
  <!-- Note: frame-ancestors requires an HTTP header (not supported in <meta>); configure at the server level if possible -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://static.cloudflareinsights.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' https: data:;
    connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://api.web3forms.com https://cloudflareinsights.com;
    frame-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self' https://api.web3forms.com;
  ">

  <!-- Google Analytics -->
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CDBGC4SGKY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CDBGC4SGKY');
  </script>

  <title>{{title}}</title>
  <meta name="description" content="{{description}}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trlhomesolutions.com{{path}}">
  <meta property="og:image" content="https://trlhomesolutions.com{{image}}">
  <meta property="og:image:alt" content="{{title}}">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://trlhomesolutions.com{{image}}">
  <meta name="twitter:image:alt" content="{{title}}">

  <link rel="canonical" href="https://trlhomesolutions.com{{path}}">

  <!-- Favicon & Apple Touch Icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/images/logo/icon-512.png">
  <link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">

  <!-- Fonts (Inter Variable) and icons (inline SVG) are bundled at build time; see src/css/main.css -->

  <!-- Main CSS -->
  <link rel="stylesheet" href="/src/css/main.css">
